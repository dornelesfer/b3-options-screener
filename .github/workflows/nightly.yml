# Nightly EOD data refresh for the B3 options screener — see README_DEPLOY.md
name: nightly-data-refresh

on:
  schedule:
    # B3 publishes the EOD COTAHIST file in the evening BRT. Two slots: the
    # first at 22:47 BRT, a catch-up at 01:47 BRT for late publication or a
    # transient fetch failure. Both are idempotent (exit clean on "no new
    # file"). Odd minute on purpose: GitHub delays :00/:30 crons the most.
    - cron: "47 1 * * 2-6"
    - cron: "47 4 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

# never let two refreshes race on the same parquet files / push
concurrency:
  group: nightly-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ingest new B3 daily files
        run: python update_daily_data.py

      - name: Refresh CDI / IBOV series (BCB + Yahoo, incremental)
        run: python download_bcb_series.py

      - name: Rebuild screener metrics
        run: python screener_metrics.py

      - name: Commit refreshed data
        run: |
          git config user.name "nightly-bot"
          git config user.email "actions@github.com"
          git add data/*.parquet data/*.csv data/screener/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: nightly refresh $(date -u +%F)"
          # a code push may have landed while we ran; data files are ours alone
          git pull --rebase origin master
          git push
